ExpConfig:
  dataset_dir: preprocessed/dl3dv-2-256px
  shift: 3
  bucket_config_name: ASPECT_RATIO_256

  max_chunks: 20
  num: 24

  use_fixed_noise: true
  noise_cache_dir: configs/noise/352_192/noise0 
  checkpoint_path: weights/train-10-ttt/steps600.ckpt

OnlineTrainConfig:
  open: true
  n_train_steps: 3              # 参数量放大到 240M，步数从 5 降到 3，避免单 chunk 过拟合
  lr: 3.0e-6                    # TTT 专用学习率（每个 chunk 新建优化器，动量不跨 chunk）
  grad_clip_norm: 0.5           # 只裁剪白名单参数的梯度；null 表示不裁剪

  trainable_layers:
    - "blocks.ffn.2"            # FFN W_down 8960->1536：写入 residual 的 value
    - "blocks.self_attn.k"      # 历史 token 的 key：决定检索命中什么
    - "blocks.self_attn.v"      # 历史 token 的 value：决定检索回什么内容
    - "blocks.modulation"       # AdaLN shift/scale
    - "blocks.norm3"            # cross-attn LayerNorm affine
  trainable_block_start: 14     # 只训 blocks.<i>（i >= 该值）；TTT 反传到此为止，省显存
  trainable_block_end: 26       # 可训 block 上界（i <= 该值），-1 表示不设上界

  reset_between_videos: true
